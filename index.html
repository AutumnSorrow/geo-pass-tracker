<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>地理课前通关 · 教师打勾销账端</title>
<style>
  :root {
    --bg: #0B1324; --card: #13203B; --card2: #1A2B4E; --border: #2A416E;
    --text: #F8FAFC; --muted: #94A3B8; --gold: #FACC15;
    --green: #10B981; --green-bg: rgba(16,185,129,0.16);
    --red: #F43F5E; --red-bg: rgba(244,63,94,0.20);
    --amber: #F59E0B; --amber-bg: rgba(245,158,11,0.20);
    --blue: #3B82F6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 78px; overflow-x: hidden;
  }
  .app-wrap { width: 100%; max-width: 960px; margin: 0 auto; padding: 10px 12px; overflow-x: hidden; }
  /* Top Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 12px; gap: 8px; flex-wrap: wrap;
  }
  .cls-tabs { display: flex; background: #080E1C; padding: 3px; border-radius: 10px; border: 1px solid var(--border); }
  .cls-tab {
    padding: 7px 18px; font-size: 16px; font-weight: 800; color: var(--muted);
    background: transparent; border: none; border-radius: 8px; cursor: pointer;
  }
  .cls-tab.active { background: var(--blue); color: #FFF; }
  .sync-pill {
    font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 20px;
    background: var(--card2); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  /* 教室黑板实时联网状态与远程考试免打扰栏 */
  .board-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; background: #0E1930; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px;
  }
  .board-pills { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .b-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 20px;
    background: #081020; border: 1px solid #243B67; font-size: 12.5px; font-weight: 800; color: #CBD5E1; cursor: pointer;
  }
  .b-pill.is-online { border-color: rgba(16,185,129,0.55); background: rgba(16,185,129,0.12); color: #ECFDF5; }
  .b-pill.is-paused { border-color: rgba(245,158,11,0.65); background: rgba(245,158,11,0.15); color: #FEF3C7; }
  .b-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748B; flex-shrink: 0; }
  .b-dot.online { background: #10B981; box-shadow: 0 0 8px #10B981; }
  .b-dot.paused { background: #F59E0B; box-shadow: 0 0 8px #F59E0B; }
  .b-ctl-btn {
    padding: 6px 12px; border-radius: 9px; border: 1px solid rgba(250,204,21,0.5);
    background: rgba(250,204,21,0.14); color: var(--gold); font-size: 12.5px; font-weight: 800; cursor: pointer; white-space: nowrap;
  }
  .ctl-chip {
    padding: 8px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--card2);
    color: #F8FAFC; font-size: 13px; font-weight: 800; cursor: pointer;
  }
  .ctl-chip:active { transform: scale(0.97); }
  /* Episode Bar */
  .ep-bar {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .ep-row { display: flex; gap: 8px; align-items: center; }
  .ep-sel {
    flex: 1 1 0; width: 0; background: #080E1C; color: var(--gold); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 10px; font-size: 14.5px; font-weight: 700; min-width: 0;
  }
  .btn {
    padding: 10px 14px; font-size: 14.5px; font-weight: 800; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card2); color: #FFF; cursor: pointer; white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-green { background: var(--green); color: #042F1E; border: none; }
  .btn-gold { background: var(--gold); color: #422006; border: none; }
  .stat-strip {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    font-size: 13.5px; color: var(--muted); padding-top: 4px; border-top: 1px dashed var(--border);
  }
  /* Student Grid (反向打勾大按钮) */
  .sec-title { font-size: 14px; font-weight: 800; color: var(--gold); margin: 10px 2px 8px; display: flex; justify-content: space-between; }
  .stu-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  @media (min-width: 640px) {
    .stu-grid { grid-template-columns: repeat(5, 1fr); gap: 10px; }
  }
  .stu-card {
    padding: 18px 6px 10px; border-radius: 12px; border: 2px solid var(--border);
    background: var(--card); text-align: center; cursor: pointer; position: relative;
    transition: transform 0.08s; user-select: none; min-width: 0;
  }
  .stu-card:active { transform: scale(0.95); }
  .stu-card.st-pass { background: var(--green-bg); border-color: var(--green); }
  .stu-card.st-fail { background: var(--red-bg); border-color: var(--red); }
  .stu-card.st-repass { background: var(--amber-bg); border-color: var(--amber); }
  .stu-name { font-size: 15.5px; font-weight: 800; color: #FFF; margin-bottom: 4px; word-break: break-all; }
  .stu-badge { font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 6px; display: inline-block; }
  .st-pass .stu-badge { color: #6EE7B7; }
  .st-fail .stu-badge { color: #FDA4AF; background: rgba(159,18,57,0.55); }
  .st-repass .stu-badge { color: #FDE68A; }
  .focus-star { position: absolute; top: 4px; right: 6px; font-size: 12px; color: var(--gold); }
  /* Debt List & Cheat Sheet */
  .debt-card {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .debt-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .debt-item {
    background: #091224; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-top: 8px;
  }
  .debt-item-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cheat-box {
    margin-top: 10px; padding: 10px; background: #111E36; border-radius: 9px;
    border-left: 3px solid var(--green); display: none;
  }
  .cheat-box img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px; margin-bottom: 8px; background: #061020; }
  /* Table */
  .tbl-wrap { overflow-x: auto; background: var(--card); border-radius: 14px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: center; white-space: nowrap; }
  th { background: #091224; color: var(--gold); font-weight: 800; }
  /* Bottom Fixed TabBar */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
    background: rgba(11,19,36,0.97); border-top: 1.5px solid var(--border);
    display: flex; justify-content: space-around; align-items: center; z-index: 50;
  }
  .tab-item {
    flex: 1; height: 100%; border: none; background: transparent; color: var(--muted);
    font-size: 13.5px; font-weight: 800; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; cursor: pointer; position: relative;
  }
  .tab-item.active { color: var(--gold); }
  .badge-dot {
    position: absolute; top: 6px; right: calc(50% - 26px); background: var(--red);
    color: #FFF; font-size: 11px; font-weight: 900; padding: 1px 6px; border-radius: 10px;
  }
  /* Modal */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 99; padding: 14px; }
  .modal-inner { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--card); border: 2px solid var(--border); border-radius: 16px; padding: 18px; }
  .inp { width: 100%; background: #080E1C; color: #FFF; border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 14px; margin-top: 5px; font-family: inherit; }
</style>
</head>
<body>
<div class="app-wrap">
  <header class="header">
    <div class="cls-tabs">
      <button class="cls-tab active" id="t-c10" onclick="setCls('10班')">高三 10班</button>
      <button class="cls-tab" id="t-c11" onclick="setCls('11班')">高三 11班</button>

    <div style="display:flex;gap:8px;align-items:center;">
      <div class="sync-pill" onclick="openCloudModal()" id="sync-status">☁️ 配置云同步</div>
      <button class="btn" style="padding:6px 11px;font-size:13px;" onclick="openRosterModal()">👥 改名单</button>
    </div>

        <span id="btxt-10">10班黑板: 检测中...</span>
      </div>
      <div class="b-pill" id="bp-11" onclick="openBoardCtlModal('11')" title="点击查看11班黑板详情或远程开关自动弹窗">
        <span class="b-dot" id="bdot-11"></span>
        <span id="btxt-11">11班黑板: 检测中...</span>
      </div>
    </div>
    <button class="b-ctl-btn" onclick="openBoardCtlModal('all')">🛡️ 考试免打扰</button>

  <div id="view-root"></div>
</div>

<nav class="tabbar">
  <button class="tab-item active" id="nav-check" onclick="setTab('check')">
    <span style="font-size:19px;">✍️</span><span>当堂打勾</span>
  </button>
  <button class="tab-item" id="nav-debt" onclick="setTab('debt')">
    <span style="font-size:19px;">🔥</span><span>欠账销账榜</span>

  <button class="tab-item" id="nav-stat" onclick="setTab('stat')">
    <span style="font-size:19px;">📊</span><span>考核台账/导出</span>

<!-- 学生名单批量导入与点选托底弹窗 -->
<div class="modal" id="roster-modal">
  <div class="modal-inner">
    <h3 style="color:var(--gold);margin-bottom:8px;">👥 批量导入名单 & 点选托底生（<span id="rm-cls"></span>）</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
      <label class="btn btn-gold" style="padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;">
        📂 导入Excel/CSV花名册(.xlsx/.csv)
        <input type="file" accept=".xlsx,.csv,.txt" style="display:none" onchange="importExcelRoster(event)">
      </label>
      <button class="btn" style="padding:7px 12px;font-size:13px;" onclick="smartCleanPaste()">🧹 智能清洗粘贴文本(去学号/分数)</button>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:6px;">方式① 点上方按钮直接选Excel名册自动识别（含班级列可一次导入10、11两班）；方式② 从Excel/微信复制一列直接粘贴到下方：</p>
    <textarea class="inp" id="roster-txt" rows="6" oninput="renderRosterChips()" placeholder="直接从Excel复制姓名列粘贴到这里（支持空格、换行、顿号分隔）..."></textarea>
    <div style="font-size:12.5px;color:var(--gold);font-weight:700;margin:10px 0 6px;">👇 轻触下方姓名即可标记/取消「★托底重点关注」（无需手打星号）：</div>
    <div id="roster-chips" style="display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow-y:auto;padding:4px;background:#080E1C;border-radius:8px;border:1px solid var(--border);"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:12px;">
      <button class="btn" onclick="document.getElementById('roster-modal').style.display='none'">取消</button>
      <button class="btn btn-green" onclick="saveRoster()">💾 保存名单并同步云端</button>
    </div>
  </div>
</div>

<!-- 教室黑板在线监控 & 远程考试免打扰控制弹窗 -->
<div class="modal" id="board-ctl-modal">
  <div class="modal-inner">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h3 style="color:var(--gold);font-size:18px;">📡 教室黑板在线监控 & 远程考试免打扰</h3>
      <button class="btn" style="padding:4px 10px;font-size:12.5px;" onclick="fetchBoardHeartbeats(true)">🔄 刷新状态</button>
    </div>
    <div id="board-detail-cards" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;"></div>

    <div style="background:#081020;border:1px solid var(--border);border-radius:12px;padding:12px;">
      <div style="font-size:14px;font-weight:800;color:var(--gold);margin-bottom:8px;">🛡️ 远程设定【考试免打扰】（期间不自动弹窗，到期自动恢复！）</div>
      <label style="font-size:12.5px;color:var(--muted);">选择控制的教室黑板：</label>
      <select class="inp" id="ctl-target-cls" style="margin-bottom:10px;font-weight:800;">
        <option value="all">🏫 全部教室（高三 10班 + 高三 11班）</option>
        <option value="10">📍 仅 高三 10班 黑板</option>
        <option value="11">📍 仅 高三 11班 黑板</option>

      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;">

        <button class="ctl-chip" onclick="sendQuickBoardPause(2)">📝 暂停 2 天</button>
        <button class="ctl-chip" onclick="sendQuickBoardPause(3)">📝 暂停 3 天(月考/期中)</button>
        <button class="ctl-chip" onclick="sendQuickBoardPause(5)">📝 暂停 5 天</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">

      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px dashed var(--border);flex-wrap:wrap;">
        <button class="btn btn-green" style="padding:8px 14px;font-size:13.5px;" onclick="sendRemoteBoardControl(0, '')">🟢 立即恢复自动弹窗</button>
        <span id="ctl-send-hint" style="font-size:12px;color:var(--muted);">免跑教室 · 签名防伪直达</span>
      </div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px;">
          <label style="font-size:12px;color:#93C5FD;font-weight:700;">🔐 远控防伪签名口令（与黑板设置保持一致，防公网伪造停课）：</label>
          <span id="ctl-sec-badge" style="font-size:11.5px;font-weight:800;color:#FDE68A;"></span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <input class="inp" type="password" id="ctl-secret-quick" style="flex:1;min-width:170px;margin-top:0;padding:6px 9px;font-size:13px;" placeholder="输入与黑板一致的签名口令">
          <button class="ctl-chip" style="padding:6px 10px;font-size:12.5px;" onclick="genQuickCtlSecret()">🎲 生成</button>
          <button class="ctl-chip" style="padding:6px 10px;font-size:12.5px;border-color:var(--green);color:#6EE7B7;" onclick="saveQuickCtlSecret()">💾 保存口令</button>

    <div style="display:flex;justify-content:flex-end;margin-top:12px;">
      <button class="btn" onclick="document.getElementById('board-ctl-modal').style.display='none'">关闭</button>
    </div>
  </div>
</div>

<!-- 云同步配置弹窗（方案A） -->
<div class="modal" id="cloud-modal">
  <div class="modal-inner">
    <h3 style="color:var(--gold);margin-bottom:8px;">☁️ 手机 ↔ 办公电脑 实时云同步配置</h3>
    <div style="margin-bottom:10px;">
      <label style="font-size:13.5px;font-weight:700;">选择云存储通道：</label>

        <option value="supabase">通道2：Supabase 国内直连云数据库（4G/5G极速）</option>

      <input class="inp" id="sb-url" placeholder="https://xxxx.supabase.co">
      <label style="font-size:13px;color:var(--muted);display:block;margin-top:8px;">Supabase Anon Key：</label>
      <input class="inp" type="password" id="sb-key" placeholder="eyJhbGci...">
      <label style="font-size:13px;color:var(--muted);display:block;margin-top:8px;">您的私人同步口令（手机与电脑填相同口令）：</label>
      <input class="inp" id="sb-room" value="qingyun_geo_10_11">
    </div>
    <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);">
      <label style="font-size:13px;color:#93C5FD;display:block;">🔐 教室黑板远控签名口令（可选，开启 ntfy 秒级防伪加密远控）：</label>
      <input class="inp" type="password" id="cloud-ctl-secret" placeholder="与教室黑板【设置】中填写相同口令即可">
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:14px;flex-wrap:wrap;gap:8px;">
      <button class="btn" onclick="pullFromCloud(true)">🔄 立即从云端拉取合并</button>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="document.getElementById('cloud-modal').style.display='none'">关闭</button>
        <button class="btn btn-green" onclick="saveCloudCfg()">⚡ 保存并安全同步</button>
      </div>
    </div>
  </div>
</div>

<script src="./geo_bank_data.js"></script>
<script>
const BANK = (window.GEO_DEFAULT_BANK && window.GEO_DEFAULT_BANK.items) || [];
const DIAG_BASE = "./diagrams/";

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function initDefaultData() {
  // 按期中真实成绩升序预置槽位（10班前6名为<50分托底生，11班前8名为<50分托底生）
  const s10 = [19,22,24,25,27,30, 31,31,32,35,35,37,39,40,40,43,50,53,53,71];
  const s11 = [21,27,28,28,29,30,30,30, 32,32,33,34,34,36,37,38,43,50,51,52];
  return {
    updatedAt: 0,
    isDefaultSeed: true,
    rosters: {
      "10班": s10.map((sc, i) => `10-${String(i+1).padStart(2,'0')}(${sc}分)${i<6?'*':''}`),
      "11班": s11.map((sc, i) => `11-${String(i+1).padStart(2,'0')}(${sc}分)${i<8?'*':''}`)
    },
    rosterMeta: { "10班": 0, "11班": 0 },
    // records["10班"]["1"] = { "姓名": "pass" | "fail" | "repass" }
    records: { "10班": {}, "11班": {} },
    // cellMeta["10班"]["1"]["姓名"] = epochMs（用于手机/电脑双端并发无损字段级合并）
    cellMeta: { "10班": {}, "11班": {} }
  };
}

function isLikelyDefaultSeed(obj) {
  if (!obj || typeof obj !== "object") return true;
  if (obj.isDefaultSeed === true) return true;
  if (obj.isDefaultSeed === false) return false;
  const r10 = (obj.rosters && obj.rosters["10班"]) || [];
  const r11 = (obj.rosters && obj.rosters["11班"]) || [];
  const rec10 = Object.keys((obj.records && obj.records["10班"]) || {});
  const rec11 = Object.keys((obj.records && obj.records["11班"]) || {});
  if (rec10.length > 0 || rec11.length > 0) return false;
  const allPlaceholder = [...r10, ...r11].every(x => /^(10|11)-\d{2}\(\d+分\)\*?$/.test(String(x || "")));
  return allPlaceholder;
}

function ensureDbSchema(raw) {
  const base = initDefaultData();
  if (!raw || typeof raw !== "object") return base;
  const out = {
    updatedAt: Number(raw.updatedAt || 0),
    isDefaultSeed: isLikelyDefaultSeed(raw),
    rosters: {
      "10班": Array.isArray(raw.rosters && raw.rosters["10班"]) ? [...raw.rosters["10班"]] : base.rosters["10班"],
      "11班": Array.isArray(raw.rosters && raw.rosters["11班"]) ? [...raw.rosters["11班"]] : base.rosters["11班"]
    },
    rosterMeta: {
      "10班": Number((raw.rosterMeta && raw.rosterMeta["10班"]) || (isLikelyDefaultSeed(raw) ? 0 : (raw.updatedAt || 1))),
      "11班": Number((raw.rosterMeta && raw.rosterMeta["11班"]) || (isLikelyDefaultSeed(raw) ? 0 : (raw.updatedAt || 1)))
    },
    records: { "10班": {}, "11班": {} },
    cellMeta: { "10班": {}, "11班": {} }
  };
  const fallbackTs = out.isDefaultSeed ? 0 : (out.updatedAt || 1);
  for (const cls of ["10班", "11班"]) {
    const srcRecs = (raw.records && raw.records[cls]) || {};
    const srcMeta = (raw.cellMeta && raw.cellMeta[cls]) || {};
    for (const eid of Object.keys(srcRecs)) {
      const ep = srcRecs[eid];
      if (!ep || typeof ep !== "object") continue;
      out.records[cls][eid] = {};
      out.cellMeta[cls][eid] = {};
      for (const nm of Object.keys(ep)) {
        out.records[cls][eid][nm] = ep[nm];
        out.cellMeta[cls][eid][nm] = Number((srcMeta[eid] && srcMeta[eid][nm]) || fallbackTs);
      }
    }
  }
  return out;
}

function mergeTeacherDb(localRaw, remoteRaw) {
  const loc = ensureDbSchema(localRaw);
  const rem = ensureDbSchema(remoteRaw);
  if (loc.isDefaultSeed && !rem.isDefaultSeed) return rem;
  if (!loc.isDefaultSeed && rem.isDefaultSeed) return loc;

  const merged = ensureDbSchema(null);
  merged.isDefaultSeed = loc.isDefaultSeed && rem.isDefaultSeed;
  merged.updatedAt = Math.max(loc.updatedAt || 0, rem.updatedAt || 0);

  for (const cls of ["10班", "11班"]) {
    const lRm = Number(loc.rosterMeta[cls] || 0);
    const rRm = Number(rem.rosterMeta[cls] || 0);
    if (rRm > lRm) {
      merged.rosters[cls] = [...rem.rosters[cls]];
      merged.rosterMeta[cls] = rRm;
    } else {
      merged.rosters[cls] = [...loc.rosters[cls]];
      merged.rosterMeta[cls] = lRm;
    }

    const epSet = new Set([
      ...Object.keys(loc.records[cls] || {}),
      ...Object.keys(rem.records[cls] || {})
    ]);
    for (const eid of epSet) {
      const lEp = loc.records[cls][eid] || {};
      const rEp = rem.records[cls][eid] || {};
      const lMeta = loc.cellMeta[cls][eid] || {};
      const rMeta = rem.cellMeta[cls][eid] || {};
      merged.records[cls][eid] = {};
      merged.cellMeta[cls][eid] = {};
      const stuSet = new Set([...Object.keys(lEp), ...Object.keys(rEp)]);
      for (const nm of stuSet) {
        const hasL = Object.prototype.hasOwnProperty.call(lEp, nm);
        const hasR = Object.prototype.hasOwnProperty.call(rEp, nm);
        const tL = hasL ? Number(lMeta[nm] || loc.updatedAt || 1) : -1;
        const tR = hasR ? Number(rMeta[nm] || rem.updatedAt || 1) : -1;
        if (hasR && (!hasL || tR > tL)) {
          merged.records[cls][eid][nm] = rEp[nm];
          merged.cellMeta[cls][eid][nm] = tR;
        } else if (hasL) {
          merged.records[cls][eid][nm] = lEp[nm];
          merged.cellMeta[cls][eid][nm] = tL;
        }
      }
    }
  }
  return merged;
}

// 原生零依赖读取 .xlsx 文件：优先解析 ZIP Central Directory (0x02014b50)，完整兼容 WPS/Excel Online/openpyxl 流式 Data Descriptor
async function parseXlsxRows(buf) {
  const bytes = new Uint8Array(buf), view = new DataView(buf);
  const td = new TextDecoder("utf-8");
  const files = {};

  async function extractEntry(name, method, comp) {
    if (!name.startsWith("xl/sharedStrings") && !name.startsWith("xl/worksheets/sheet")) return;
    if (method === 0) {
      files[name] = td.decode(comp);
    } else if (method === 8 && typeof DecompressionStream !== "undefined") {
      const ds = new DecompressionStream("deflate-raw");
      const wr = ds.writable.getWriter();
      wr.write(comp);
      wr.close();
      files[name] = await new Response(ds.readable).text();
    }
  }

  // 1. 定位 End of Central Directory (0x06054b50)
  let eocdPos = -1;
  const minEocd = Math.max(0, bytes.length - 65557);
  for (let p = bytes.length - 22; p >= minEocd; p--) {
    if (view.getUint32(p, true) === 0x06054b50) { eocdPos = p; break; }
  }

  let parsedByCd = false;
  if (eocdPos >= 0) {
    const cdSize = view.getUint32(eocdPos + 12, true);
    const cdOffset = view.getUint32(eocdPos + 16, true);
    if (cdOffset + cdSize <= bytes.length) {
      let ptr = cdOffset;
      const cdEnd = cdOffset + cdSize;
      while (ptr + 46 <= cdEnd && view.getUint32(ptr, true) === 0x02014b50) {
        const method = view.getUint16(ptr + 10, true);
        const cSize = view.getUint32(ptr + 20, true);
        const nLen = view.getUint16(ptr + 28, true);
        const eLen = view.getUint16(ptr + 30, true);
        const cLen = view.getUint16(ptr + 32, true);
        const lfhOffset = view.getUint32(ptr + 42, true);
        const name = td.decode(bytes.subarray(ptr + 46, ptr + 46 + nLen));
        ptr += 46 + nLen + eLen + cLen;

        if (lfhOffset + 30 <= bytes.length && view.getUint32(lfhOffset, true) === 0x04034b50) {
          const lNameLen = view.getUint16(lfhOffset + 26, true);
          const lExtraLen = view.getUint16(lfhOffset + 28, true);
          const dataStart = lfhOffset + 30 + lNameLen + lExtraLen;
          if (dataStart + cSize <= bytes.length) {
            await extractEntry(name, method, bytes.subarray(dataStart, dataStart + cSize));
            parsedByCd = true;
          }
        }
      }
    }
  }

  // 2. 兜底：若文件缺失 EOCD，则按 Local File Header 线性扫描（兼容普通非流式 ZIP）
  if (!parsedByCd) {
    let i = 0;
    while (i < bytes.length - 30) {
      if (view.getUint32(i, true) === 0x04034b50) {
        const method = view.getUint16(i + 8, true);
        const cSize = view.getUint32(i + 18, true);
        const nLen = view.getUint16(i + 26, true), eLen = view.getUint16(i + 28, true);
        const name = td.decode(bytes.subarray(i + 30, i + 30 + nLen));
        const start = i + 30 + nLen + eLen;
        if (cSize > 0 && start + cSize <= bytes.length) {
          await extractEntry(name, method, bytes.subarray(start, start + cSize));
          i = start + cSize;
        } else {
          i++;
        }
      } else i++;
    }
  }
  const docParser = new DOMParser();
  const sst = [];
  if (files["xl/sharedStrings.xml"]) {
    const xml = docParser.parseFromString(files["xl/sharedStrings.xml"], "application/xml");
    xml.querySelectorAll("si").forEach(si => {
      sst.push(Array.from(si.querySelectorAll("t")).map(t => t.textContent).join(""));
    });
  }
  const allRows = [];
  Object.keys(files).filter(k => k.startsWith("xl/worksheets/sheet")).sort().forEach(k => {
    const xml = docParser.parseFromString(files[k], "application/xml");
    xml.querySelectorAll("row").forEach(rEl => {
      const row = [];
      rEl.querySelectorAll("c").forEach(cEl => {
        const ref = cEl.getAttribute("r") || "A1";
        let colIdx = 0;
        for (const ch of ref.replace(/\d+/g,"")) colIdx = colIdx * 26 + (ch.charCodeAt(0) - 64);
        const t = cEl.getAttribute("t");
        const vEl = cEl.querySelector("v"), isEl = cEl.querySelector("is t");
        let val = isEl ? isEl.textContent : (vEl ? vEl.textContent : "");
        if (t === "s" && val !== "") val = sst[ parseInt(val, 10) ] || "";
        row[colIdx - 1] = String(val).trim();
      });
      if (row.some(Boolean)) allRows.push(row);
    });
  });
  return allRows;
}

async function importExcelRoster(ev) {
  const f = ev.target.files[0]; if (!f) return;
  try {
    let rows = [];
    if (f.name.toLowerCase().endsWith(".xlsx")) {
      rows = await parseXlsxRows(await f.arrayBuffer());
    } else {
      const txt = await f.text();
      rows = txt.split(/\r?\n/).map(l => l.split(/[,\t;]/).map(s=>s.trim()));
    }
    if (!rows.length) throw new Error("未读到表格内容");
    // 查找表头：姓名列、班级列、成绩列
    let nameCol = -1, clsCol = -1, scCol = -1, startR = 0;
    for (let r = 0; r < Math.min(8, rows.length); r++) {
      rows[r].forEach((cell, ci) => {
        if (!cell) return;
        if (/姓名|学生/.test(cell) && nameCol < 0) { nameCol = ci; startR = r + 1; }
        if (/班级|班别/.test(cell) && clsCol < 0) clsCol = ci;
        if (/赋分|总分|成绩|得分/.test(cell) && scCol < 0) scCol = ci;
      });
      if (nameCol >= 0) break;
    }
    if (nameCol < 0) {
      // 自动探测中文姓名列
      const counts = {};
      rows.slice(0, 25).forEach(r => r.forEach((c, ci) => { if (/^[\u4e00-\u9fa5]{2,4}$/.test(c||"")) counts[ci] = (counts[ci]||0)+1; }));
      const best = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
      if (best) nameCol = parseInt(best[0], 10); else nameCol = 0;
    }
    const byCls = { "10班": [], "11班": [], "cur": [] };
    for (let r = startR; r < rows.length; r++) {
      const nm = (rows[r][nameCol] || "").trim();
      if (!/^[\u4e00-\u9fa5·]{2,5}$/.test(nm) || ["姓名","学生姓名","合计","平均分"].includes(nm)) continue;
      const sc = scCol >= 0 ? parseFloat(rows[r][scCol]) : NaN;
      const cRaw = clsCol >= 0 ? String(rows[r][clsCol] || "") : "";
      if (/10|810/.test(cRaw)) byCls["10班"].push({ nm, sc });
      else if (/11|811/.test(cRaw)) byCls["11班"].push({ nm, sc });
      else byCls["cur"].push({ nm, sc });
    }
    const fmtGroup = (arr, focN) => {
      if (arr.some(x => !isNaN(x.sc))) arr.sort((a,b) => (a.sc||999) - (b.sc||999));
      return arr.map((x, idx) => x.nm + (!isNaN(x.sc) && idx < focN ? "*" : ""));
    };
    if (byCls["10班"].length && byCls["11班"].length) {
      const nowTs = Date.now();
      db.rosters["10班"] = fmtGroup(byCls["10班"], 6);
      db.rosters["11班"] = fmtGroup(byCls["11班"], 8);
      db.rosterMeta["10班"] = nowTs;
      db.rosterMeta["11班"] = nowTs;
      saveLocalAndSync(true);
      document.getElementById("roster-txt").value = db.rosters[ui.cls].join("\n");
      renderRosterChips();
      alert(`🎉 一键导入成功！\n已自动识别并导入 10班（${db.rosters["10班"].length}人）和 11班（${db.rosters["11班"].length}人）名单！`);
    } else {
      const list = byCls[ui.cls].length ? byCls[ui.cls] : byCls["cur"];
      if (!list.length) throw new Error("未在表格中找到有效学生姓名");
      const formatted = fmtGroup(list, ui.cls==="10班"?6:8);
      document.getElementById("roster-txt").value = formatted.join("\n");
      renderRosterChips();
      alert(`已提取 ${formatted.length} 名学生姓名！可点选确认★托底生后点击【保存名单】。`);
    }
  } catch (err) { alert("导入提示：" + err.message); }
  ev.target.value = "";
}

function hasExistingRemoteTarget() {
  if (location.protocol.startsWith("http") && cloudCfg.mode === "lan") return true;
  if (cloudCfg.mode === "gist" && cloudCfg.token && cloudCfg.gistId) return true;
  if (cloudCfg.mode === "supabase" && cloudCfg.sbUrl && cloudCfg.sbKey) return true;
  return false;
}
async function fetchRemoteDbOnly() {
  if (location.protocol.startsWith("http") && cloudCfg.mode === "lan") {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error("局域网读取失败");
    return await r.json();
  }
  if (cloudCfg.mode === "gist" && cloudCfg.token && cloudCfg.gistId) {
    const r = await fetch(`https://api.github.com/gists/${cloudCfg.gistId}`, {
      cache: "no-store",
      headers: { "Authorization": `Bearer ${cloudCfg.token}`, "Accept": "application/vnd.github+json" }
    });
    if (!r.ok) throw new Error("Gist读取失败(" + r.status + ")");
    const d = await r.json();
    const rawContent = d.files && d.files["geo_records.json"] && d.files["geo_records.json"].content;
    return rawContent ? JSON.parse(rawContent) : null;
  }
  if (cloudCfg.mode === "supabase" && cloudCfg.sbUrl && cloudCfg.sbKey) {
    const r = await fetch(`${cloudCfg.sbUrl}/rest/v1/geo_sync?room_id=eq.${encodeURIComponent(cloudCfg.sbRoom)}&select=payload`, {
      cache: "no-store",
      headers: { "apikey": cloudCfg.sbKey, "Authorization": `Bearer ${cloudCfg.sbKey}` }
    });
    if (!r.ok) throw new Error("Supabase读取失败(" + r.status + ")");
    const arr = await r.json();
    return (arr && arr[0] && arr[0].payload) ? arr[0].payload : null;
  }
  return null;
}

async function saveCloudCfg() {
  const ctlEl = document.getElementById("cloud-ctl-secret");
  cloudCfg = {
    mode: document.getElementById("cloud-mode").value,
    token: document.getElementById("gist-token").value.trim(),
    gistId: document.getElementById("gist-id").value.trim(),

    ctlSecret: ctlEl ? ctlEl.value.trim() : (cloudCfg.ctlSecret || "")
  };
  localStorage.setItem("geo_cloud_cfg_v1", JSON.stringify(cloudCfg));
  hasSyncedRemoteOnce = false;
  document.getElementById("cloud-modal").style.display = "none";

  // 关键保护：连接已有云账本时必须先拉取合并，严禁新设备用默认假名单覆盖云端真实数据！
  if (hasExistingRemoteTarget()) {
    const pulled = await pullFromCloud(true);
    if (!pulled) return;
    if (!db.isDefaultSeed) {
      await pushToCloud(true, true);
    } else {
      setSyncPill("🟢 云端已同步", "var(--green)");
    }
  } else {
    await pushToCloud(true, true);
  }
}

async function pushToCloud(manual, skipPreMerge) {
  try {
    if (!skipPreMerge && hasExistingRemoteTarget()) {
      try {
        const remoteBefore = await fetchRemoteDbOnly();
        if (remoteBefore && remoteBefore.rosters) {
          db = mergeTeacherDb(db, remoteBefore);
          localStorage.setItem("geo_teacher_db_v1", JSON.stringify(db));
          hasSyncedRemoteOnce = true;
          render();
        }
      } catch (preErr) {
        // 新设备尚未拉取过云端时拉取失败，禁止盲推默认数据覆盖云端
        if (!hasSyncedRemoteOnce && db.isDefaultSeed) throw preErr;
      }
    }
    // 禁止拿未修改的默认假名单去覆盖已有云端账本
    if (db.isDefaultSeed && hasExistingRemoteTarget()) {
      setSyncPill("🟢 云端就绪(未改)", "var(--green)");
      return;
    }

    if (location.protocol.startsWith("http") && cloudCfg.mode === "lan") {
      const r = await fetch("/api/state", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(db) });
      if (!r.ok) throw new Error("局域网写入失败(" + r.status + ")");
      hasSyncedRemoteOnce = true;
      setSyncPill("🟢 已同步电脑", "var(--green)");
      return;
    }
    if (cloudCfg.mode === "gist" && cloudCfg.token) {
      setSyncPill("⏳ 正在同步...", "var(--gold)");
      const headers = { "Authorization": `Bearer ${cloudCfg.token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" };
      if (!cloudCfg.gistId) {
        const res = await fetch("https://api.github.com/gists", {
          method: "POST", headers,
          body: JSON.stringify({ description: "高三地理课前通关辅差考核云账本", public: false, files: { "geo_records.json": { content: JSON.stringify(db) } } })
        });
        if (!res.ok) throw new Error("Gist创建失败(" + res.status + ")");
        const data = await res.json();
        cloudCfg.gistId = data.id;
        localStorage.setItem("geo_cloud_cfg_v1", JSON.stringify(cloudCfg));
        if (manual) alert("已为您自动创建专属私有云账本！\n请记下此账本ID填到手机端即可双端实时互通：\n" + data.id);
      } else {
        const res = await fetch(`https://api.github.com/gists/${cloudCfg.gistId}`, {
          method: "PATCH", headers,
          body: JSON.stringify({ files: { "geo_records.json": { content: JSON.stringify(db) } } })
        });
        if (!res.ok) throw new Error("Gist更新失败(" + res.status + ")");
      }
      hasSyncedRemoteOnce = true;
      setSyncPill("🟢 云端已同步", "var(--green)");
    } else if (cloudCfg.mode === "supabase" && cloudCfg.sbUrl && cloudCfg.sbKey) {
      setSyncPill("⏳ 正在同步...", "var(--gold)");
      const res = await fetch(`${cloudCfg.sbUrl}/rest/v1/geo_sync`, {
        method: "POST",
        headers: { "apikey": cloudCfg.sbKey, "Authorization": `Bearer ${cloudCfg.sbKey}`, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
        body: JSON.stringify({ room_id: cloudCfg.sbRoom, payload: db, updated_at: new Date().toISOString() })
      });
      if (!res.ok) throw new Error("Supabase同步失败(" + res.status + ")");
      hasSyncedRemoteOnce = true;
      setSyncPill("🟢 云端已同步", "var(--green)");
    }
  } catch (e) {
    setSyncPill("🔴 仅存本机", "var(--red)");
    if (manual) alert("云同步连接提示：" + e.message);
  }
}

async function pullFromCloud(manual) {
  try {
    const remote = await fetchRemoteDbOnly();
    hasSyncedRemoteOnce = true;
    if (remote && remote.rosters) {
      db = mergeTeacherDb(db, remote);
      localStorage.setItem("geo_teacher_db_v1", JSON.stringify(db));
      render();
      setSyncPill(cloudCfg.mode === "lan" ? "🟢 已同步电脑" : "🟢 云端已同步", "var(--green)");
    } else if (manual) {
      setSyncPill("🟡 云端暂无数据", "var(--gold)");
    }
    return true;
  } catch (e) {
    if (manual) alert("拉取失败：" + e.message);
    return false;
  }
}

let boardHbMap = JSON.parse(localStorage.getItem("geo_board_hb_v1") || '{"10":null,"11":null}');
let remoteCtlCache = JSON.parse(localStorage.getItem("geo_board_ctl_v1") || '{"updated_at":0,"classes":{"10":{"cmd_ts":0,"pause_until_ms":0,"pause_label":""},"11":{"cmd_ts":0,"pause_until_ms":0,"pause_label":""}}}');

function fmtShortTime(ms) {
  if (!ms) return "";
  const d = new Date(ms), now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return d.toDateString() === now.toDateString() ? hm : `${d.getMonth()+1}/${d.getDate()} ${hm}`;
}
function fmtPauseLabel(ms) {
  const d = new Date(ms), pad = n => String(n).padStart(2, "0");
  return `${d.getMonth()+1}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function getEffectivePause(cCode) {
  const hb = boardHbMap[cCode];
  const ctl = (remoteCtlCache.classes && remoteCtlCache.classes[cCode]) || null;
  if (ctl && (!hb || ctl.cmd_ts > (hb.ts || 0))) {
    return { untilMs: ctl.pause_until_ms || 0, label: ctl.pause_label || "" };
  }
  if (hb) return { untilMs: hb.pauseUntilMs || 0, label: hb.pauseLabel || "" };
  return { untilMs: 0, label: "" };
}

  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = msgBytes.length;
  const padLen = ((l + 9 + 63) & ~63);
  const buf = new Uint8Array(padLen);
  buf.set(msgBytes);
  buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  const bitLenHi = Math.floor((l * 8) / 0x100000000);
  const bitLenLo = (l * 8) >>> 0;
  dv.setUint32(padLen - 8, bitLenHi, false);
  dv.setUint32(padLen - 4, bitLenLo, false);
  const W = new Uint32Array(64);
  for (let off = 0; off < padLen; off += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4, false);
    for (let i = 16; i < 64; i++) {
      const s0 = ((W[i-15] >>> 7) | (W[i-15] << 25)) ^ ((W[i-15] >>> 18) | (W[i-15] << 14)) ^ (W[i-15] >>> 3);
      const s1 = ((W[i-2] >>> 17) | (W[i-2] << 15)) ^ ((W[i-2] >>> 19) | (W[i-2] << 13)) ^ (W[i-2] >>> 10);
      W[i] = (W[i-16] + s0 + W[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + W[i]) >>> 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  const out = new Uint8Array(32);
  const odv = new DataView(out.buffer);
  for (let i = 0; i < 8; i++) odv.setUint32(i * 4, H[i], false);
  return out;
}

function hmacSha256Hex(secretStr, messageStr) {
  const te = new TextEncoder();
  let keyBytes = te.encode(String(secretStr || ""));
  if (keyBytes.length > 64) keyBytes = sha256Bytes(keyBytes);
  const blockKey = new Uint8Array(64);
  blockKey.set(keyBytes);
  const ipad = new Uint8Array(64), opad = new Uint8Array(64);
  for (let i = 0; i < 64; i++) { ipad[i] = blockKey[i] ^ 0x36; opad[i] = blockKey[i] ^ 0x5c; }
  const msgBytes = te.encode(String(messageStr || ""));
  const inner = new Uint8Array(64 + msgBytes.length);
  inner.set(ipad); inner.set(msgBytes, 64);
  const innerHash = sha256Bytes(inner);
  const outer = new Uint8Array(64 + 32);
  outer.set(opad); outer.set(innerHash, 64);
  const mac = sha256Bytes(outer);
  return Array.from(mac, b => b.toString(16).padStart(2, "0")).join("");
}

function buildCanonicalControlString(ctlObj) {
  const c10 = (ctlObj && ctlObj.classes && ctlObj.classes["10"]) || {};
  const c11 = (ctlObj && ctlObj.classes && ctlObj.classes["11"]) || {};
  const part = (k, e) => `${k}:${Number(e.cmd_ts || 0)}:${Number(e.pause_until_ms || 0)}:${String(e.pause_label || "")}`;
  return `v1|${Number((ctlObj && ctlObj.updated_at) || 0)}|${part("10", c10)}|${part("11", c11)}`;
}

function verifyControlObject(ctlObj, source) {
  if (!ctlObj || typeof ctlObj !== "object" || !ctlObj.classes) return false;
  const secret = String(cloudCfg.ctlSecret || "").trim();
  if (secret) {
    if (!ctlObj.sig || typeof ctlObj.sig !== "string") return false;
    const expected = hmacSha256Hex(secret, buildCanonicalControlString(ctlObj));
    return ctlObj.sig.toLowerCase() === expected;
  }
  // 未设口令时，拒绝公网匿名 ntfy.sh 的未签名消息，防止界面被伪造指令误导
  return source === "repo";
}

function updateCtlSecBadge() {
  const b = document.getElementById("ctl-sec-badge");
  const inp = document.getElementById("ctl-secret-quick");
  if (inp) inp.value = cloudCfg.ctlSecret || "";
  if (!b) return;
  if (cloudCfg.ctlSecret) {
    b.style.color = "#6EE7B7";
    b.textContent = "🟢 已开启 HMAC-SHA256 签名保护";
  } else {
    b.style.color = "#FDE68A";
    b.textContent = "⚠️ 未设口令（ntfy 通道会被黑板拒收）";
  }
}

function genQuickCtlSecret() {
  const bytes = new Uint8Array(18);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
  else for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
  const val = "geo_" + Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
  const inp = document.getElementById("ctl-secret-quick");
  if (inp) { inp.type = "text"; inp.value = val; }
}

function saveQuickCtlSecret() {
  const inp = document.getElementById("ctl-secret-quick");
  if (!inp) return;
  cloudCfg.ctlSecret = inp.value.trim();
  localStorage.setItem("geo_cloud_cfg_v1", JSON.stringify(cloudCfg));
  inp.type = "password";
  updateCtlSecBadge();
  const hint = document.getElementById("ctl-send-hint");
  if (hint) {
    hint.style.color = "var(--green)";
    hint.textContent = cloudCfg.ctlSecret ? "✅ 远控签名口令已保存，请在黑板【设置】填入相同口令" : "⚠️ 已清空签名口令";
  }
}

async function fetchBoardHeartbeats(manual) {
  try {
    const [hbRes, ctlRes, ghCtlRes] = await Promise.all([
      fetch(`https://ntfy.sh/${HB_TOPIC}/json?poll=1&since=12h`, { cache: "no-store" }).catch(() => null),
      fetch(`https://ntfy.sh/${CTL_TOPIC}/json?poll=1&since=12h`, { cache: "no-store" }).catch(() => null),
      fetch(`https://autumnsorrow.github.io/geo-pass-tracker/board/board_control.json?t=${Date.now()}`, { cache: "no-store" }).catch(() => null)
    ]);
    if (hbRes && hbRes.ok) {
      const txt = await hbRes.text();
      txt.split(/\r?\n/).forEach(line => {
        if (!line.trim()) return;
        try {
          const ev = JSON.parse(line);
          if (ev.event === "message" && ev.message) ingestHbObject(JSON.parse(ev.message));
        } catch (_) {}
      });
    }
    if (ctlRes && ctlRes.ok) {
      const cTxt = await ctlRes.text();
      cTxt.split(/\r?\n/).forEach(line => {
        if (!line.trim()) return;
        try {
          const ev = JSON.parse(line);
          if (ev.event === "message" && ev.message) {
            const cObj = JSON.parse(ev.message);
            if (verifyControlObject(cObj, "ntfy") && (cObj.updated_at || 0) > (remoteCtlCache.updated_at || 0)) {
              remoteCtlCache = cObj;
              localStorage.setItem("geo_board_ctl_v1", JSON.stringify(remoteCtlCache));
            }
          }
        } catch (_) {}
      });
    }
    if (ghCtlRes && ghCtlRes.ok) {
      const gObj = await ghCtlRes.json();
      if (verifyControlObject(gObj, "repo") && (gObj.updated_at || 0) > (remoteCtlCache.updated_at || 0)) {
        remoteCtlCache = gObj;
        localStorage.setItem("geo_board_ctl_v1", JSON.stringify(remoteCtlCache));
      }
    }
  } catch (_) {}
  renderBoardStatusUI();
}

function startLiveHeartbeatStream() {
  try {
    if (!window.EventSource) return;
    const es = new EventSource(`https://ntfy.sh/${HB_TOPIC}/sse`);
    es.onmessage = e => {
      try {
        const ev = JSON.parse(e.data);
        if (ev && ev.message) { ingestHbObject(JSON.parse(ev.message)); renderBoardStatusUI(); }
      } catch (_) {}
    };
  } catch (_) {}
}

function openBoardCtlModal(defaultTarget) {
  const sel = document.getElementById("ctl-target-cls");
  if (sel && defaultTarget) sel.value = defaultTarget;
  const dtInp = document.getElementById("ctl-custom-dt");
  if (dtInp && !dtInp.value) {
    const d = new Date(Date.now() + 3 * 86400000);
    d.setHours(18, 0, 0, 0);
    const pad = n => String(n).padStart(2, "0");
    dtInp.value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T18:00`;
  }
  updateCtlSecBadge();
  document.getElementById("board-ctl-modal").style.display = "flex";
  renderBoardStatusUI();
  fetchBoardHeartbeats(false);
}

async function syncControlSnapshotToRepo(ctlObj) {
  if (!cloudCfg.token) return false;
  try {
    const apiUrl = "https://api.github.com/repos/AutumnSorrow/geo-pass-tracker/contents/board/board_control.json";
    const headers = { "Authorization": `Bearer ${cloudCfg.token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" };
    let sha = undefined;
    const getRes = await fetch(apiUrl, { headers });
    if (getRes.ok) { const gd = await getRes.json(); sha = gd.sha; }
    const contentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(ctlObj, null, 2))));
    const putRes = await fetch(apiUrl, {
      method: "PUT", headers,
      body: JSON.stringify({ message: "remote board dnd control update", content: contentB64, sha })
    });
    return putRes.ok;
  } catch (_) { return false; }
}

async function sendRemoteBoardControl(untilMs, label) {
  const target = document.getElementById("ctl-target-cls").value;
  const hint = document.getElementById("ctl-send-hint");
  const nowTs = Date.now();
  if (untilMs > nowTs + MAX_PAUSE_SPAN_MS) {
    alert("安全熔断：单次考试免打扰最长不可超过 31 天，请重新选择恢复时间。");
    return;
  }
  const secret = String(cloudCfg.ctlSecret || "").trim();
  if (!secret && !cloudCfg.token) {
    alert("安全拦截：请先在下方设置【远控防伪签名口令】（或在云同步配置中填入 GitHub Token），黑板端已默认拒收无签名匿名指令。");
    return;
  }
  if (hint) { hint.textContent = "⏳ 正在签名并下发指令..."; hint.style.color = "var(--gold)"; }
  const nextClasses = Object.assign({
    "10": { cmd_ts: 0, pause_until_ms: 0, pause_label: "" },
    "11": { cmd_ts: 0, pause_until_ms: 0, pause_label: "" }
  }, remoteCtlCache.classes || {});

  const targets = target === "all" ? ["10", "11"] : [target];
  targets.forEach(c => {
    nextClasses[c] = { cmd_ts: nowTs, pause_until_ms: untilMs, pause_label: label };
  });
  const payload = { updated_at: nowTs, classes: nextClasses };
  if (secret) {
    payload.sig_ver = 1;
    payload.sig = hmacSha256Hex(secret, buildCanonicalControlString(payload));
  }

  try {
    const tasks = [syncControlSnapshotToRepo(payload)];
    if (secret) {
      tasks.unshift(fetch(`https://ntfy.sh/${CTL_TOPIC}`, { method: "POST", body: JSON.stringify(payload) }).catch(() => null));
    } else {
      tasks.unshift(Promise.resolve(null));
    }
    const [ntfyRes, repoOk] = await Promise.all(tasks);
    const ntfyOk = !!(ntfyRes && ntfyRes.ok);
    if (!ntfyOk && !repoOk) throw new Error(secret ? "网络发送异常" : "GitHub 写入失败，且未设远控口令");
    remoteCtlCache = payload;
    localStorage.setItem("geo_board_ctl_v1", JSON.stringify(remoteCtlCache));
    renderBoardStatusUI();
    if (hint) {
      hint.style.color = "var(--green)";
      const modeTag = secret ? "已HMAC签名直达" : "已写GitHub快照";
      hint.textContent = untilMs > nowTs ? `✅ 已设定免打扰至 ${label}（${modeTag}）` : `✅ 已发送恢复自动弹窗指令（${modeTag}）`;
    }
  } catch (e) {
    if (hint) { hint.style.color = "var(--red)"; hint.textContent = "❌ 发送失败：" + e.message; }
  }
}

function sendQuickBoardPause(days) {
  const d = new Date();
  if (days <= 0) d.setHours(23, 59, 0, 0);
  else { d.setDate(d.getDate() + days); d.setHours(21, 30, 0, 0); }
  const ms = d.getTime();
  sendRemoteBoardControl(ms, fmtPauseLabel(ms));
}

function sendCustomBoardPause() {
  const v = document.getElementById("ctl-custom-dt").value;
  if (!v) { alert("请先选择恢复日期和时间"); return; }
  const ms = new Date(v).getTime();
  if (isNaN(ms) || ms <= Date.now()) { alert("请选择未来的时间点"); return; }
  if (ms > Date.now() + MAX_PAUSE_SPAN_MS) { alert("单次免打扰最长不可超过 31 天"); return; }
  sendRemoteBoardControl(ms, fmtPauseLabel(ms));
}

// 支持 #gist=xxx&tk=xxx&ctl=xxx 安全配对（导入本地存储后立即擦除地址栏哈希！）
if (location.hash && (location.hash.includes("tk=") || location.hash.includes("ctl="))) {
  const hp = new URLSearchParams(location.hash.slice(1));
  let changed = false;
  if (hp.get("tk")) {
    cloudCfg.mode = "gist";
    cloudCfg.token = hp.get("tk");
    if (hp.get("gist")) cloudCfg.gistId = hp.get("gist");
    changed = true;
  }
  if (hp.get("ctl")) {
    cloudCfg.ctlSecret = hp.get("ctl");
    changed = true;
  }
  if (changed) {
    localStorage.setItem("geo_cloud_cfg_v1", JSON.stringify(cloudCfg));
    history.replaceState(null, "", location.pathname + location.search);
  }
}
window.addEventListener("visibilitychange", () => { if (!document.hidden) pullFromCloud(false); });
if (location.protocol.startsWith("http") && !cloudCfg.token && !cloudCfg.sbUrl) { cloudCfg.mode = "lan"; }
const dp = new URLSearchParams(location.search).get("demo");
if (dp === "check" || dp === "debt") {
  db.records["10班"]["1"] = {};
  db.rosters["10班"].forEach((r, i) => { db.records["10班"]["1"][cleanName(r)] = (i===0||i===2) ? "fail" : (i===1 ? "repass" : "pass"); });
  if (dp === "debt") { ui.tab = "debt"; ui.openCheats[`${cleanName(db.rosters["10班"][0])}_1`] = true; }
}
render();
renderBoardStatusUI();
if (!dp) {
  pullFromCloud(false);
  fetchBoardHeartbeats(false);
  startLiveHeartbeatStream();
  setInterval(() => fetchBoardHeartbeats(false), 90000);
}
